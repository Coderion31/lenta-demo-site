<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новостная лента</title>
<meta name="description" content="Новостная лента: свежие заголовки с ссылками на источники.">
<style>:root {
  --bg: #121316;
  --surface: #1b1d22;
  --surface-2: #202329;
  --ink: #f1f2f4;
  --ink-2: #c9ccd3;
  --muted: #9aa0aa;
  --line: rgba(255, 255, 255, .07);
  --accent: #8a7cf0;
  --radius: 12px;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

p { margin: 0; }
a { color: inherit; }
ul { list-style: none; margin: 0; padding: 0; }

/* ---------- шапка ---------- */

.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.top__inner {
  max-width: 620px;
  margin: 0 auto;
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.search {
  position: relative;
  width: 100%;
}

.search__icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.search input {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  padding: 0 16px 0 42px;
  font: inherit;
  transition: border-color .16s ease;
}

.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); }

/* ---------- лента ---------- */

.page {
  max-width: 620px;
  margin: 0 auto;
  padding: 16px 16px 60px;
}

.status {
  color: var(--muted);
  font-size: 13px;
  padding: 0 6px 10px;
}

.news {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.news__item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  text-decoration: none;
  transition: background .15s ease, border-color .15s ease;
}

.news__item:hover { background: var(--surface-2); border-color: var(--line); }

.news__logo {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  flex: none;
  user-select: none;
}

.news__title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 550;
  line-height: 1.35;
  letter-spacing: -.01em;
}

.news__source {
  flex: none;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

/* ---------- нажимной текст «Ещё 5» ---------- */

.more {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 18px 6px 0;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  transition: color .15s ease;
}

.more::before,
.more::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.more:hover { color: var(--ink); }
.more:active { color: var(--accent); }
.more[hidden] { display: none; }

/* ---------- пусто ---------- */

.empty {
  margin-top: 40px;
  text-align: center;
  color: var(--muted);
}</style>
</head>
<body>
<header class="top">
  <div class="top__inner">
    <form class="search" role="search" id="searchForm">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16.2 16.6 4.1 4.1" /></svg>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Поиск по новостям" aria-label="Поиск по новостям">
    </form>
  </div>
</header>

<main class="page">
  <p class="status" id="status">Загружаю новости…</p>
  <ul class="news" id="news"></ul>
  <p class="more" id="more" role="button" tabindex="0">Ещё 5 новостей</p>
  <p class="empty" id="empty" hidden>Ничего не нашлось</p>
</main>

протестах участвовали сотни тысяч французов",   "url": "https://ria.ru/20261018/frantsiya-2125293345.html",   "source": "РИА Новости",   "published": 1792349517000  },  {   "title": "США пригрозили ЕС разрушительным ответом на возможные ограничения Starlink",   "url": "https://www.kommersant.ru/doc/9041503",   "source": "Коммерсантъ",   "published": 1792349517000  } ]};</script>
<script>const NEWS_URL = "data/news.json";
const REFRESH_MS = 300000;
const FALLBACK = [
  { t: "В аэропортах Москвы задержали 103 рейса на вылет и прилёт", l: "https://dzen.ru/news/story/853150c7-d102-57ee-a1c0-325298f9f7c6", s: "Город" },
  { t: "Свыше 370 рейсов задержаны и отменены в аэропортах Москвы", l: "https://dzen.ru/news/story/e9e8d9e2-b851-5722-a29b-8bdca93a5450", s: "Город" },
  { t: "Румынские истребители F-16 сбили два беспилотника над Чёрным морем", l: "https://dzen.ru/news/story/f43daee6-0f9e-5f8a-af94-f5852d7d672c", s: "Мир" },
  { t: "Новак: первый танкер с дизелем РФ отгружен из порта Дикси", l: "https://dzen.ru/news/story/08836f9f-230f-53b8-9b9c-b25bf53a8cb5", s: "Экономика" },
  { t: "Второй за день нефтяной танкер подорвался на мине в Ормузском проливе", l: "https://dzen.ru/news/story/5c5f75bf-6ae7-5490-887d-00b2df92f0f4", s: "Мир" },
  { t: "Власти Ирана передали США семилетний план по разблокировке Ормузского пролива", l: "https://dzen.ru/news/story/a6df4895-6700-5ccc-a616-5fcdc3d262a8", s: "Мир" },
  { t: "В Ормузском проливе поражен танкер с 15 индийцами на борту", l: "https://dzen.ru/news/story/5d8f2821-d85e-5c1c-99b5-ab1245510041", s: "Мир" },
  { t: "Глава JPMorgan Даймон: ВС РФ сегодня могли бы дойти до Парижа", l: "https://dzen.ru/news/story/e8a92f32-b836-5e31-a8f8-ad58cbc32d63", s: "Мир" },
  { t: "В Киеве проходит митинг с требованием отставки мэра Кличко", l: "https://dzen.ru/news/story/aafe7f70-10df-5d85-a194-98118f8be1ce", s: "Мир" },
  { t: "Украинский беспилотник влетел в квартиру дома в Энергодаре", l: "https://dzen.ru/news/story/b1ae1c5b-04ab-5ea6-9af8-5ec9a15db65a", s: "Мир" }
].map((n) => ({ title: n.t, url: n.l, source: n.s, published: 0 }));

const list = document.getElementById("news");
const more = document.getElementById("more");
const empty = document.getElementById("empty");
const status = document.getElementById("status");
const input = document.getElementById("searchInput");

let items = [];
let expanded = false;
let updatedAt = null;

const COLORS = ["#8a7cf0", "#e0532b", "#2f6bff", "#1c8a8a", "#c81f45", "#a8541b", "#13883f", "#3f4b5b"];

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return COLORS[h % COLORS.length];
}

function initial(name) {
  const clean = String(name || "?").replace(/\./g, " ").trim();
  return clean ? clean[0].toUpperCase() : "?";
}

function itemHTML(n) {
  return (
    '<li><a class="news__item" href="' + n.url + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="news__logo" style="background:' + colorFor(n.source) + '">' + initial(n.source) + "</span>" +
      '<span class="news__title">' + n.title + "</span>" +
      '<span class="news__source">' + n.source + "</span>" +
    "</a></li>"
  );
}

function visible() {
  return expanded ? items : items.slice(0, 5);
}

function render() {
  const needle = input.value.trim().toLowerCase();
  const source = needle ? items.filter((n) => n.title.toLowerCase().includes(needle)) : visible();
  list.innerHTML = source.map(itemHTML).join("");
  empty.hidden = source.length > 0;
  more.hidden = expanded || needle.length > 0 || items.length <= 5;
}

function applyItems(rows) {
  items = rows
    .filter((n) => n.title && /^https?:\/\//.test(n.url))
    .map((n) => ({ title: n.title, url: n.url, source: n.source || "Новости", published: n.published || 0 }))
    .slice(0, 10);
  expanded = false;
  render();
}

async function loadNews() {
  if (location.protocol === "file:") {
    if (items.length) status.textContent = updatedAt ? "Обновлено в " + new Date(updatedAt).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "Локальная копия";
    return;
  }
  status.textContent = "Обновляю новости…";
  try {
    const res = await fetch(NEWS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items) || data.items.length < 5) throw new Error("мало");
    applyItems(data.items);
    updatedAt = data.updatedAt || null;
    const t = updatedAt ? new Date(updatedAt).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    status.textContent = "Обновлено в " + t;
  } catch (e) {
    if (!items.length) {
      items = FALLBACK.slice();
      expanded = false;
      render();
      status.textContent = "Нет связи — показана сохранённая подборка";
    } else {
      status.textContent = "Не удалось обновить — показаны предыдущие новости";
    }
  }
}

more.addEventListener("click", () => { expanded = true; render(); });
more.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); expanded = true; render(); } });
input.addEventListener("input", render);
document.getElementById("searchForm").addEventListener("submit", (e) => e.preventDefault());

const bundled = window.__NEWS__;
if (bundled && Array.isArray(bundled.items) && bundled.items.length >= 5) {
  applyItems(bundled.items);
  updatedAt = bundled.updatedAt || null;
  if (updatedAt) {
    const bt = new Date(updatedAt).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    status.textContent = "Обновлено в " + bt;
  }
} else {
  render();
}
loadNews();
setInterval(() => { if (document.visibilityState === "visible") loadNews(); }, REFRESH_MS);</script>
</body>
