<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новостная лента</title>
<meta name="description" content="Новостная лента: свежие заголовки с ссылками на источники.">
<style>:root {
  --bg: #121316;
  --surface: #1b1d22;
  --ink: #f1f2f4;
  --ink-2: #c9ccd3;
  --muted: #9aa0aa;
  --line: rgba(255, 255, 255, .10);
  --accent: #8a7cf0;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

p { margin: 0; }
a { color: inherit; }
ul { list-style: none; margin: 0; padding: 0; }

/* ---------- шапка ---------- */

.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.top__inner {
  max-width: 860px;
  margin: 0 auto;
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.search {
  position: relative;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.search__icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.search input {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  padding: 0 16px 0 42px;
  font: inherit;
  transition: border-color .16s ease;
}

.search input::placeholder { color: var(--muted); }

.search input:focus {
  outline: none;
  border-color: var(--accent);
}

/* ---------- лента ---------- */

.page {
  max-width: 860px;
  margin: 0 auto;
  padding: 12px 16px 60px;
}

.news { display: flex; flex-direction: column; max-width: 460px; margin: 0 auto; }

.news__item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 4px;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  transition: background .15s ease;
  }

.news__item:hover { background: var(--surface); }

.news__logo {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  object-fit: cover;
  flex: none;
  }
  
  .news__title {
  font-size: 14.5px;
  font-weight: 550;
  line-height: 1.3;
  letter-spacing: -.01em;
  }

.news__title:hover { color: var(--ink-2); }

/* ---------- разделитель ---------- */

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 16px 6px;
  color: var(--muted);
  font-size: 12.5px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---------- пусто ---------- */

.empty {
  margin-top: 40px;
  text-align: center;
  color: var(--muted);
}</style>
</head>
<body>
<header class="top">
  <div class="top__inner">
    <form class="search" role="search" id="searchForm">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16.2 16.6 4.1 4.1" /></svg>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Поиск по новостям" aria-label="Поиск по новостям">
    </form>
  </div>
</header>

<main class="page">
  <ul class="news" id="news"></ul>
  <p class="divider" id="divider">Ещё 5 новостей</p>
  <ul class="news news--more" id="newsMore"></ul>
  <p class="empty" id="empty" hidden>Ничего не нашлось</p>
</main>

const first = NEWS.slice(0, 5);
const second = NEWS.slice(5);

const list1 = document.getElementById("news");
const list2 = document.getElementById("newsMore");
const divider = document.getElementById("divider");
const empty = document.getElementById("empty");
const input = document.getElementById("searchInput");

function itemHTML(n) {
  return (
    '<li><a class="news__item" href="' + n.l + '" target="_blank" rel="noopener noreferrer">' +
      '<img class="news__logo" src="' + n.i + '" alt="" loading="lazy">' +
      '<span class="news__title">' + n.t + "</span>" +
    "</a></li>"
  );
}

function renderAll() {
  list1.innerHTML = first.map(itemHTML).join("");
  list2.innerHTML = second.map(itemHTML).join("");
  divider.hidden = false;
  empty.hidden = true;
}

function renderFilter(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) { renderAll(); return; }
  const hit1 = first.filter((n) => n.t.toLowerCase().includes(needle));
  const hit2 = second.filter((n) => n.t.toLowerCase().includes(needle));
  list1.innerHTML = hit1.map(itemHTML).join("");
  list2.innerHTML = hit2.map(itemHTML).join("");
  divider.hidden = true;
  empty.hidden = hit1.length + hit2.length > 0;
}

renderAll();

input.addEventListener("input", () => renderFilter(input.value));
document.getElementById("searchForm").addEventListener("submit", (e) => e.preventDefault());</script>
