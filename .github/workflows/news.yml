name: newson:  schedule:    - cron: "*/20 * * * *"  workflow_dispatch:permissions:  contents: writeconcurrency:  group: news  cancel-in-progress: truejobs:  update:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: actions/setup-node@v4        with:          node-version: "20"      - name: Собрать ленту из RSS        run: node scripts/aggregate.mjs      - name: Закоммитить обновление        run: |          git config user.name "github-actions[bot]"          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"          git add data/news.json          if git diff --staged --quiet; then            echo "no changes"          else            git commit -m "Обновление ленты новостей"            git push          fi